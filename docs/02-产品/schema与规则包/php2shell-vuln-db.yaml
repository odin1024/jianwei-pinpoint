id: php2shell
name: "PHP2Shell (CVE-2026-109618 / CVE-2026-109619)"
version: "2026.10.28-1"
published_at: "2026-10-28T00:00:00Z"
severity: critical
cvss_v4: 9.2
cvss_vector: "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
summary: >
  PHP 解释器内核内存安全缺陷，未认证远程代码执行 + 进程内存泄露。
  触发位于请求启动阶段，早于任何应用脚本执行，应用层防护措施（WAF、安全插件、
  disable_functions、代码审计）均无法规避。修复仅能通过升级 PHP 运行时实现。

disclosure:
  reported_at: "2026-08-11"
  published_at: "2026-10-21T14:00:00Z"
  exploitation_seen_since: "2026-10-17"
  reporters: ["lcfr-hax (Calif)", "Wiz Research", "OpenAI"]
  advisories:
    - key: PHP-2026-10-21-5
      url: "https://www.php.net/archive/2026.php#2026-10-21-5"

cves:
  - id: CVE-2026-109618
    ghsa: GHSA-w8hw-w9fx-j79w
    title: "RCE via OOM corruption"
    cwe: [CWE-416, CWE-755, CWE-824, CWE-1325, CWE-1419]
    root_cause: >
      PHP 使用 longjmp() 处理 OOM 以跳出当前上下文。部分上下文在请求内存尚未
      完全初始化时即可访问；此时任何分配失败都会留下未正确处理的提前退出，
      使请求内存处于非法状态。失败的分配无需与被破坏内存相关。request shutdown
      可能读取或基于该状态分支，导致 RCE。
    trigger_vectors:
      - "multipart 请求无可用的声明 content-length，绕过初始 post_max_size 检查后继续供给数据"
      - "单个 part 携带无限制数量的 header，内部表示开销远大于线路表示"
      - "空文件控件不计入 max_file_uploads，但仍创建文件元数据数组；嵌套字段名成倍放大"
      - "应用层攻击者可控输入导致的大分配（应用相关路径）"
  - id: CVE-2026-109619
    ghsa: GHSA-6wmf-4rv5-p3rp
    title: "RCE via stale global state"
    cwe: [CWE-416, CWE-755, CWE-824, CWE-1325, CWE-1419]
    root_cause: >
      请求级状态被存入全局可访问位置，未重置或在重置后被重新填充；请求内存被释放
      而常驻 worker 仍保留全局引用；同一 worker 的下一个请求在正常初始化重置前
      访问该过期状态，构成 UAF。
    producers_consumers:
      - producer: "session.upload_progress 反序列化"
        consumer: "下一请求的上传进度清理路径"
        impact: "内存泄露（PHPSESSID 回显）→ 与内存破坏组合实现 RCE"
      - producer: "致命 OOM 错误回溯（EG(last_fatal_error_backtrace)）"
        consumer: "下一请求早期的 INI 诊断/warning"
        impact: "跨请求 UAF → 受控内存破坏 → RCE（仅 mod_php 已验证）"
      - producer: "任意可达的全局状态写入"
        consumer: "请求初始化前的 INI 警告/废弃提示"
        impact: "无需 fatal、无需显示或记录即可触发，error_reporting 无法关闭"
    notable_settings:
      - "auto_detect_line_endings=1"
      - "filter.default 非默认值"
      - "PHP 8.3+ 遗留 assert.* 配置"
      - "PHP 8.4+ 遗留 session 配置"
      - "PHP 8.5 report_memleaks=0 或非零 intl.error_level"
      - "显式配置的 mbstring.* / iconv.* 编码项"
      - "非法或冲突的 zend.assertions / memory_limit / date.timezone / 扩展项"

