sapi_matrix:
  apache2handler:
    exploitable: confirmed
    app_independent: true
    weight: 1.0
    note: "无条件执行 request shutdown，请求启动阶段即可触发；默认配置下已演示完整 RCE"
  frankenphp:
    exploitable: likely
    app_independent: true
    weight: 1.0
    note: "源码分析与 mod_php 同构，未验证"
  fpm-fcgi:
    exploitable: confirmed
    app_independent: false
    weight: 0.75
    note: "启动失败会杀子进程；109619 的 session 生命周期 RCE 已在 FPM 验证"
  litespeed:
    exploitable: likely
    app_independent: false
    weight: 0.75
    note: "模型类似 FPM，应用相关利用可能，未验证"
  cgi-fcgi:
    exploitable: possible
    app_independent: false
    weight: 0.4
  cli:
    exploitable: none
    app_independent: false
    weight: 0.1
    note: "单次执行、进程退出，无法构造跨请求利用链"
  cli-server:
    exploitable: possible
    app_independent: false
    weight: 0.5

preconditions:
  - key: memory_limit
    constraint: finite
    affects: [CVE-2026-109618, CVE-2026-109619]
    weight: 0.35
    note: "有限值是可控制 OOM 的前提；-1 可阻断已确认路径但不是完整缓解"
  - key: session.upload_progress.enabled
    default: "1"
    affects: [CVE-2026-109619]
    weight: 0.30
    note: "已验证的 producer 之一"
  - key: post_max_size
    affects: [CVE-2026-109618]
    weight: 0.15
    note: "保守值 + 前端独立校验可降低风险"
  - key: max_file_uploads
    affects: [CVE-2026-109618]
    weight: 0.05
    note: "空文件控件不计入此限制"
  - key: max_input_nesting_level
    affects: [CVE-2026-109618]
    weight: 0.05
    note: "嵌套字段名放大数组开销"
  - key: fatal_error_backtraces
    applies_to_branch: "8.5"
    affects: [CVE-2026-109619]
    weight: 0.10

patch_markers:
  changelog_patterns:
    - 'CVE-2026-10961[89]'
    - 'php2shell'
  package_probe:
    rpm: "rpm -q --changelog {package} | grep -nE 'CVE-2026-10961[89]'"
    dpkg: "zcat /usr/share/doc/{package}/changelog.Debian.gz | grep -nE 'CVE-2026-10961[89]'"
    apk: "apk info -a {package} | grep -iE 'CVE-2026-10961[89]'"
  binary:
    - name: "libphp-8.4.x-patched"
      applies_to: "8.4.27"
      build_id: null
      sha256: []
      signature_bytes_patched: []       # 由指纹库构建工具填充
      signature_bytes_vulnerable: []
    - name: "libphp-8.3.x-patched"
      applies_to: "8.3.36"
      build_id: null
      sha256: []
      signature_bytes_patched: []
      signature_bytes_vulnerable: []
  source:
    - "git -C {src} log --oneline --grep='CVE-2026-10961'"
    - "test -f {src}/debian/patches/series && grep -l 'CVE-2026-10961' {src}/debian/patches/*"
  semantic_hints:
    - "补丁移除了 OOM 路径上的 longjmp() 调用点"
    - "新增延迟软 OOM（下一个 VM safe point）与硬 OOM（第二阈值 _exit）"
    - "request shutdown 阶段新增 error/exception 状态清理"
    - "请求早期新增序列化与 session 状态初始化"

mitigations:
  - id: upgrade
    complete: true
    priority: 1
    action: "升级至 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 或更高版本"
    note: "官方明确：升级是唯一完整缓解手段"
  - id: eol_migrate
    complete: true
    priority: 1
    condition: "版本 <= 8.1"
    action: "无官方修复，必须迁移至受支持分支（建议 8.4/8.5）"
  - id: disable_upload_progress
    complete: false
    priority: 2
    action: "session.upload_progress.enabled=0"
    note: "仅切断已演示的 session 生命周期路径，不覆盖其他 producer"
  - id: disable_backtraces
    complete: false
    priority: 2
    condition: "PHP 8.5"
    action: "fatal_error_backtraces=0"
  - id: memory_limit_disable
    complete: false
    priority: 3
    action: "memory_limit=-1，并在 Web 服务器/代理层独立限制请求体大小"
    note: "非完整缓解；若 mmap 失败仍可能回到脆弱路径"
  - id: pm_max_requests
    complete: false
    priority: 3
    condition: "PHP-FPM"
    action: "pm.max_requests=1"
    note: "打破跨请求复用条件，代价是每请求一次进程启动开销"
  - id: frontend_block
    complete: false
    priority: 3
    action: "WAF/反向代理阻断已知攻击模式，限制 multipart part 数、part 内 header 数、请求体大小"
    note: "可被构造变形绕过，仅作时间窗保护"
  - id: restrict_exposure
    complete: false
    priority: 3
    condition: "无法及时修复"
    action: "临时下线、只读模式、收敛至运维网段/VPN"
  - id: forbid_rlimit
    complete: false
    forbidden: true
    action: "禁止使用 RLIMIT_AS / RLIMIT_DATA 做内存限制"
    note: "达到限制会使 mmap() 失败，重新触发脆弱的 longjmp 路径，扩大攻击面"
  - id: restart_workers
    complete: false
    priority: 1
    action: "任何配置变更后必须重启全部 PHP worker"
    note: "运行中的 worker 仍沿用旧配置；未重启等于未生效"

hunt_rules:
  - id: HUNT-001
    name: "启动期 OOM 聚集"
    confidence: medium
    pattern: 'PHP Fatal error:\s+Allowed memory size of \d+ bytes exhausted.*?in Unknown on line 0'
    threshold: 3
    window: 10m
  - id: HUNT-002
    name: "OOM 与大 POST 关联"
    confidence: high
    depends_on: [HUNT-001]
    condition: "HUNT-001 命中前后 60s 内存在 body_size > 1MB 的 POST"
  - id: HUNT-003
    name: "Worker 崩溃"
    confidence: medium
    patterns:
      - 'AH00052: child pid \d+ exit signal Segmentation fault'
      - 'child exited on signal 11'
  - id: HUNT-004
    name: "上传进度标记探测"
    confidence: medium
    pattern: 'PHP_SESSION_UPLOAD_PROGRESS'
    condition: "非业务正常调用路径"
  - id: HUNT-005
    name: "异常 PHPSESSID（内存泄露强特征）"
    confidence: high
    condition: "Set-Cookie PHPSESSID 值长度 > 200 或含连续 URL 编码二进制串"
    note: "正常 PHP session id 为定长字母数字，出现 KB 级 URL 编码串基本可确定正在打内存泄露"
  - id: HUNT-006
    name: "Multipart 异常"
    confidence: medium
    condition: "part 数 > 阈值 或 单 part header 数 > 阈值 或 字段名长度 > 64KB 或 嵌套深度异常"
  - id: HUNT-007
    name: "空文件控件滥用"
    confidence: medium
    condition: "单请求空 filename=\"\" 字段数远超业务基线"
  - id: HUNT-008
    name: "PHP 进程派生 shell"
    confidence: high
    condition: "php-fpm/httpd 子进程为 sh/bash/dash/perl/python/curl/wget/nc"
  - id: HUNT-009
    name: "Web 目录新增可执行文件"
    confidence: high
    condition: "mtime > 2026-10-17 且扩展名 ∈ {php,phtml,php3,php4,php5,phar} 且非发布窗口"
  - id: HUNT-010
    name: "可疑外连"
    confidence: high
    condition: "web worker 出站至非常规端口或非常规地域"
  - id: HUNT-011
    name: "持久化痕迹"
    confidence: high
    condition: "新增 cron / systemd unit / authorized_keys / UID 0 账户"
  - id: HUNT-012
    name: "时间线关联升级"
    confidence: high
    condition: "10 分钟窗口内共现 >= 3 类规则命中 → 疑似失陷"

detection_limits:
  - "成功利用可能既不崩溃也不报错，返回 HTTP 200 —— 日志干净不等于安全"
  - "版本号可被隐藏、改写或伪造，远程头信息不可作为定性依据"
  - "发行版可能回移补丁而不改版本号，版本比对会误报"
  - "EOL 分支装了该分支最新版仍然受影响"
  - "存在多版本共存时，必须锁定 Web 实际加载的二进制"
  - "公开 PoC 大量不可用或为恶意伪造代码，禁止在客户环境直接运行"

