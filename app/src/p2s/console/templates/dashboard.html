<script>/* ==================== 基础 ==================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(n,cls='')=>`<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
/* 相对时间：台账/报告里直接显示 ISO 串很难读，统一转成「3 分钟前」 */
function fmtTime(iso){
  if(!iso) return '-';
  const t=Date.parse(iso.replace(' ','T'));
  if(isNaN(t)) return esc(String(iso));
  const d=Date.now()-t;
  if(d<0) return esc(String(iso).slice(0,16).replace('T',' '));
  const m=Math.floor(d/60000);
  if(m<1) return '刚刚';
  if(m<60) return m+' 分钟前';
  const h=Math.floor(m/60);
  if(h<24) return h+' 小时前';
  const day=Math.floor(h/24);
  if(day<30) return day+' 天前';
  return esc(String(iso).slice(0,10));
}
/* jss：用于 onclick 等 JS 上下文。esc() 只做 HTML 实体转义，属性里的实体
   会在 JS 执行前被还原，不能用来拼 JS 字符串；这里输出 JSON 字符串再把
   双引号转成 &quot;，交给 HTML 解码后正好是合法的 JS 字面量。 */
const jss=v=>JSON.stringify(String(v??''))
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'\\u003c');
const api=async(u,o={})=>{
  const opt={headers:{'Content-Type':'application/json'},...o};
  if(o.body && !(o.body instanceof FormData)) opt.body=JSON.stringify(o.body);
  const r=await fetch(u,opt);
  if(r.status===401){location.href='/login';throw new Error('未登录或会话已过期')}
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
  return r.json()};
/* 公共确认弹窗：返回 Promise<boolean>，支持 Esc 取消、键盘可达 */
function askConfirm(opts={}){
  return new Promise(resolve=>{
    const bg=document.createElement('div'); bg.className='modal-bg';
    const box=document.createElement('div'); box.className='modal';
    box.setAttribute('role','dialog');
    box.innerHTML=`<h3>${esc(opts.title||'请确认')}</h3>
      <div class="mbody">${esc(opts.body||'')}</div>
      <div class="mfoot">
        <button class="btn" data-r="0">取消</button>
        <button class="btn ${opts.danger?'danger':'primary'}" data-r="1">${esc(opts.okText||'确定')}</button>
      </div>`;
    document.body.append(bg,box);
    requestAnimationFrame(()=>{bg.classList.add('on');box.classList.add('on');
      box.querySelector('[data-r="1"]').focus()});
    const done=v=>{document.removeEventListener('keydown',onKey);bg.remove();box.remove();resolve(v)};
    const onKey=e=>{if(e.key==='Escape')done(false)};
    document.addEventListener('keydown',onKey);
    bg.onclick=()=>done(false);
    box.querySelector('[data-r="0"]').onclick=()=>done(false);
    box.querySelector('[data-r="1"]').onclick=()=>done(true);
  });
}
/* 带「撤销」的提示：用于可逆的删除操作 */
function toastAction(msg, actionText, onAction){
  const t=document.createElement('div'); t.className='toast ok';
  const s=document.createElement('span'); s.textContent=msg;
  const b=document.createElement('button'); b.className='btn sm ghost'; b.textContent=actionText;
  b.style.marginLeft='10px';
  b.onclick=async()=>{t.remove(); try{await onAction()}catch(e){toast('撤销失败: '+e.message,'err')}};
  t.append(s,b); $('#toasts').appendChild(t);
  setTimeout(()=>{try{t.remove()}catch(e){}},9000);
}
/* 公共空状态：三个参数统一口径，避免每页各写一套 */
function emptyState(icon,title,hint){
  return `<div class="empty">${ico(icon)}<b>${esc(title)}</b>${hint?`<p>${esc(hint)}</p>`:''}</div>`;
}
function toast(msg,kind='info'){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),320)},3600)}

  harden:{t:'配置加固',s:'PHP / FPM / Web 服务器 / systemd / K8s 五层 · 包 + 回执',fn:loadHarden},
  rules:{t:'规则中心',s:'检测规则与加固规则 · 一键导出',fn:loadRules},
  ioc:{t:'IOC 库',s:'在野利用指标库',fn:loadIoc},
  schedule:{t:'计划任务',s:'定时扫描 · 自动入库',fn:loadSchedule},
  audit:{t:'审计日志',s:'所有写操作留痕',fn:loadAudit},
  remediation:{t:'整改跟踪',s:'处置状态 · 责任人 · 复扫联动',fn:loadRemediation},
  reports:{t:'报告中心',s:'历史扫描与交付报告',fn:loadReports},
  about:{t:'关于',s:'产品定位 · 覆盖范围 · 使用边界',fn:loadAbout},
};
const S={assets:[],jobs:[],timer:null};
const STATE={overview:null};   // 侧栏摘要与概览共用，避免重复请求
let _goSeq=0;                  // 页面切换序号：防止慢请求把新页面覆盖回旧内容

/* ==================== 数据动效 ==================== */
/* KPI / 统计数字滚动：只处理纯数字，带单位（%、台）的跳过，避免解析出错 */
function animateCounts(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const nodes=[...(root||document).querySelectorAll('.kpi .v.num, .jstat b')];
  nodes.forEach(el=>{
    const raw=(el.textContent||'').trim();
    if(!/^\d+$/.test(raw)) return;
    const to=parseInt(raw,10); if(!to){return}
    const t0=performance.now(), dur=540;   // 固定 540ms：0→2 这种小数字也要看得出来
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur);
      const e=1-Math.pow(1-k,3);              // easeOutCubic
      el.textContent=String(Math.round(to*e));
      if(k<1) requestAnimationFrame(step);
    };
    el.textContent='0';
    requestAnimationFrame(step);
  });
}
/* 条形图生长：从 0 过渡到目标宽度，逐条 30ms 延迟 */
function animateBars(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fills=[...(root||document).querySelectorAll('.bar-line .fill')];
  fills.forEach((el,i)=>{
    const target=el.style.width||'0%';
    el.style.transition='none'; el.style.width='0%';
    setTimeout(()=>{el.style.transition='width .64s cubic-bezier(.22,.61,.36,1)';
      el.style.width=target;}, 45*i);
  });
}
/* 卡片入场：切页时按顺序浮起（最容易被感知的一层） */
function animateIn(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // 不能截断：未被选中的元素会"直接可见"，出现"底部先出、顶部后到"的错乱（态势总览踩过）
  const items=[...(root||document).querySelectorAll('.kpi, .card')];
  items.forEach((el,i)=>{
    const delay=Math.min(i,8)*32;      // 延迟封顶 8 档（≈256ms），避免最后一个等太久
    el.style.opacity='0'; el.style.transform='translateY(8px)';
    el.style.transition='opacity .26s ease, transform .26s cubic-bezier(.22,.61,.36,1)';
    setTimeout(()=>{el.style.opacity='1';el.style.transform='none'}, delay);
  });
}
/* 骨架屏：加载态用结构占位替代文字，感知更快 */
function skeleton(rows=4){
  const line=w=>`<div class="skl" style="width:${w};height:11px;margin:9px 0"></div>`;
  return `<div class="card"><div class="card-b">
    <div class="skl" style="width:38%;height:14px;margin-bottom:16px"></div>
    ${Array.from({length:rows},(_,i)=>line([92,78,86,64][i%4]+'%')).join('')}
  </div></div>`;
}
/* 按钮 loading：禁用并换成 spinner，保留宽度不跳动 */
function setBusy(btn,on,label){
  if(!btn) return;
  if(on){
    btn.dataset.w=btn.style.width; btn.style.minWidth=btn.offsetWidth+'px';
    btn.dataset.txt=btn.textContent;
    btn.innerHTML='<span class="spinner"></span>'+(label||'');
    btn.disabled=true; btn.classList.add('busy');
  }else{
    btn.innerHTML=btn.dataset.txt||''; btn.disabled=false; btn.classList.remove('busy');
    btn.style.minWidth='';
  }
}

async function go(tab){
  const p=PAGES[tab]; if(!p) return;
  // 切页时收起所有浮层：否则告警弹层/抽屉会盖在新页面上，看起来像“卡住了”
  try{ if(typeof closeAlerts==='function') closeAlerts();
       if(typeof closeDrawer==='function') closeDrawer(); }catch(e){}
  const seq=++_goSeq;
  $('#pg-title').textContent=p.t; $('#pg-sub').textContent=p.s;
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  // 每次渲染用一个全新的宿主节点：过期的渲染写进已脱离文档的旧节点，不会污染当前页
  const host=document.createElement('div');
  const c=$('#content'); c.replaceChildren(host);
  // 切页淡入：只给新宿主加一次动画类，避免轮询刷新也触发
  c.classList.remove('page-in'); void c.offsetWidth; c.classList.add('page-in');
  host.innerHTML=skeleton();
  loadAlerts();
  try{await p.fn(host); if(seq===_goSeq){animateIn(host);animateCounts(host);animateBars(host)}}catch(e){ if(seq!==_goSeq) return;
    host.innerHTML=emptyState('alert','加载失败',e.message)}
}
$$('.nav a').forEach(a=>a.onclick=e=>{e.preventDefault();location.hash=a.dataset.tab});
$('#btn-refresh').onclick=()=>go(location.hash.slice(1)||'overview');
$('#btn-logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){}location.href='/login'};
$('#btn-menu').onclick=()=>$('.sidebar').classList.toggle('open');
$$('.nav a').forEach(a=>a.addEventListener('click',()=>$('.sidebar').classList.remove('open')));
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();$('.sidebar').classList.toggle('mini')}
  if(e.key==='Escape')closeDrawer();
});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'overview'));

/* 任务轮询：任何页面都能看到运行中的任务 */
async function pollJobs(){
  // 标签页在后台时降到 10s 一次，避免无意义地反复拉取
  if(document.hidden){ S.timer=setTimeout(pollJobs,10000); return; }
  try{
    const r=await api('/api/jobs');
    const prev=S._jobStates||{};
    const next={};
    for(const j of (r.jobs||[])){
      next[j.id]=j.state;
      const was=prev[j.id];
      if(was && (was==='running'||was==='queued') && (j.state==='done'||j.state==='failed')){
        if(j.state==='done') toast('任务完成：'+(j.title||j.kind),'ok');
        else toast('任务失败：'+(j.title||j.kind),'crit');
      }
    }
    S._jobStates=next;
    S.jobs=r.jobs||[];
    const running=S.jobs.filter(j=>j.state==='running'||j.state==='queued').length;
    const b=$('#nav-run');
    b.classList.toggle('hide',!running); b.textContent=running;
    b.classList.toggle('run',running>0);
    const na=$('#nav-assets'); na.classList.toggle('hide',!S.assets.length); na.textContent=S.assets.length;
    renderSideStat();
    if(location.hash.slice(1)==='tasks' && $('#jobs-body')) renderJobs();
    if(location.hash.slice(1)==='discover' && $('#d-jobs')){
      const before = S.jobs.map(j=>j.id+':'+j.state).join(',');
      renderDiscoverJobs();
      if(before !== S._lastJobSig){ S._lastJobSig = before; refreshDiscoverResults(); }
    }
  }catch(e){}
  S.timer=setTimeout(pollJobs,1500);
}

function renderSideStat(){
  const el=$('#side-stat-body'); if(!el) return;
  const o=STATE.overview; if(!o){el.textContent='—';return}
  el.innerHTML = o.exposed>0
    ? `<span class="r">${o.exposed} 台</span> 暴露待修复<br><span class="o">${o.unknown||0} 台</span> 版本待确认`
    : (o.unknown>0 ? `<span class="o">${o.unknown} 台</span> 版本待确认<br>其余 ${o.not_php||0} 台无关`
                    : `<span class="g">无暴露</span><br>${o.total_assets||0} 台已核查`);
}

/* ==================== 表格排序 ==================== */
function makeSortable(tableId,rowSel,getVal){
  const tbl=document.getElementById(tableId); if(!tbl) return;
  tbl.querySelectorAll('th.sortable').forEach((th,i)=>{
    th.onclick=()=>{
      const dir=th.classList.contains('asc')?'desc':'asc';
      tbl.querySelectorAll('th').forEach(x=>x.classList.remove('asc','desc'));
      th.classList.add(dir);
      const body=tbl.querySelector('tbody');
      const rows=[...body.querySelectorAll(rowSel)];
      rows.sort((a,b)=>{
        const va=String(getVal(a,i)??''), vb=String(getVal(b,i)??'');
        const na=parseFloat(va), nb=parseFloat(vb);
        if(va!==''&&vb!==''&&!isNaN(na)&&!isNaN(nb)) return dir==='asc'?na-nb:nb-na;
        return dir==='asc'?va.localeCompare(vb,'zh'):vb.localeCompare(va,'zh');
      });
      rows.forEach(r=>body.appendChild(r));
    };
  });
}

/* ==================== 告警收纳（右上铃铛） ==================== */
let ALERTS=[];
function buildAlerts(o){
  const out=[];
  if(o.exposed>0) out.push({lv:'crit',t:`${o.exposed} 台资产暴露于 CVE-2026-109618 / 109619`,
    d:'PHP 版本低于修复基线，已被 CISA 列入 KEV，需立即处置',go:'php',btn:'查看清单'});
  if(o.unknown>0) out.push({lv:'warn',t:`${o.unknown} 台版本待确认`,
    d:'这些设备不暴露 PHP 版本号，需人工确认后判定',go:'php',btn:'去确认'});
  if((o.config_issues||0)>0) out.push({lv:'warn',t:`${o.config_issues} 台主机配置不达标`,
    d:'如 session.upload_progress 开启会放大该漏洞的利用面',go:'assets',btn:'看资产'});
  if(!out.length) out.push({lv:'ok',t:'当前未发现告警',
    d:`已核查 ${o.total_assets||0} 台资产，暴露面与配置均正常`,go:'',btn:''});
  return out;
}
function renderAlerts(){
  const unread=ALERTS.filter(a=>a.lv!=='ok').length;
  const b=$('#alert-badge');
  if(b){b.textContent=unread;b.classList.toggle('hide',unread===0)}
  const btn=$('#btn-alert');
  if(btn) btn.classList.toggle('has-crit',ALERTS.some(a=>a.lv==='crit'));
  const sub=$('#alert-sub'); if(sub) sub.textContent=unread?`${unread} 项待关注`:'全部正常';
  const list=$('#alert-list'); if(!list) return;
  list.innerHTML=ALERTS.map(a=>`<div class="alert-item ${a.lv}">
    ${ico(a.lv==='ok'?'check':'alert','s12')}
    <div style="flex:1;min-width:0"><b style="font-size:12.5px">${esc(a.t)}</b>
      <div class="muted" style="font-size:11.5px;margin-top:2px;line-height:1.55">${esc(a.d)}</div></div>
    ${a.btn?`<button class="btn sm" onclick="location.hash='${a.go}';closeAlerts()">${esc(a.btn)}</button>`:''}
  </div>`).join('');
}
async function loadAlerts(){
  try{const o=await api('/api/overview'); ALERTS=buildAlerts(o); renderAlerts()}catch(e){}
}
function openAlerts(){const p=$('#alert-pop'),b=$('#alert-bg');
  if(p)p.classList.remove('hide'); if(b)b.classList.remove('hide')}
function closeAlerts(){const p=$('#alert-pop'),b=$('#alert-bg');
  if(p)p.classList.add('hide'); if(b)b.classList.add('hide')}

/* ==================== 启动 ==================== */
/* 铃铛/弹层的 DOM 在 </body> 后段，脚本执行时可能尚未解析到 —— 全部加存在性判断，
   否则一次 $() 取 null 就会中断整段启动逻辑（会表现为空白页） */
/* 弹层交互统一走**事件委托**：节点被重渲染也不会失效。
   覆盖：铃铛开关、✕ 关闭、点遮罩关闭、点弹层外关闭、Esc 关闭。 */
const alertOpen=()=>{const p=$('#alert-pop');return !!(p&&!p.classList.contains('hide'))};
document.addEventListener('click',e=>{
  const t=e.target;
  if(!(t instanceof Element)) return;
  if(t.closest('#btn-alert')){ e.preventDefault(); alertOpen()?closeAlerts():openAlerts(); return }
  if(t.closest('#alert-close')||t.closest('#alert-bg')){ e.preventDefault(); closeAlerts(); return }
  // 点弹层以外的任何地方都收起（弹层还开着时）
  if(alertOpen()&&!t.closest('#alert-pop')) closeAlerts();
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='Esc'){ closeAlerts(); closeDrawer&&closeDrawer() }
});
loadAlerts();
window.addEventListener('error',ev=>{
  const c=$('#content');
  if(c&&!c.querySelector('.card')) c.innerHTML=
    '<div class="card"><div class="card-b"><div class="empty"><b>页面脚本出错</b><p>'+
    esc(String(ev.message||'未知错误'))+'</p></div></div></div>';
});
pollJobs();
go(location.hash.slice(1)||'overview');
</script>

    <div class="sp"></div><button class="icon-btn" id="alert-close" aria-label="关闭">✕</button></div>
  <div class="pop-b" id="alert-list"></div>
</div>
