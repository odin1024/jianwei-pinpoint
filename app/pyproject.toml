[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2s"
version = "1.6.7"
description = "php2shell (CVE-2026-109618 / CVE-2026-109619) detection & exposure assessment toolkit"
readme = "README.md"
# 真实下限由依赖决定：starlette 1.10 需 >=3.11，fastapi/pydantic/pytest 需 >=3.10。
# 原写 ">=3.9" 未经验证（锁定的依赖装不上 3.9），已按实测修正。
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "见微 Pinpoint contributors" }]
keywords = ["php", "security", "cve-2026-109618", "cve-2026-109619", "php2shell", "vulnerability-detection"]

# 核心只依赖 httpx：规则库是 Python 数据、报告是字符串模板，
# 之前声明的 pyyaml / jinja2 在 src 里一次都没 import 过。
dependencies = [
    "httpx>=0.24,<1",
]

[project.optional-dependencies]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "python-multipart>=0.0.9",   # UploadFile 解析依赖，缺了上传接口直接 500
]
agent = ["httpx>=0.24"]
# 界面门禁（截图 / 布局 / 全站审计）：需要 CDP 客户端
# 另外还需系统安装 Chrome 或 Chromium（可用 P2S_CHROME 指定）
ui = ["websocket-client>=1.7"]
# 云端实验场脚本（在开发机上驱动远端主机做验证），非产品运行依赖
cloudtest = ["paramiko>=3"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    # CI 里任何测试挂起都应在 2 分钟内失败并给出栈，而不是跑满 6 小时
    "pytest-timeout>=2.3",
]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "pytest>=7.4",
    "ruff>=0.4",
    "pytest-timeout>=2.3",
]

[project.scripts]
p2s = "p2s.cli:main"
p2s-agent = "p2s.agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

# 说明：仓库里没有 src/p2s/rules 与 src/p2s/data 目录，规则以 Python 数据形式
# 内置于 core/rules.py，因此不再声明 package-data（原来的声明是空配置）。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # 项目面向 Python 3.9，刻意保留 Optional[...] 写法以保证注解在 3.9 上语义一致
    "UP007",
    "UP045",
]

# app.py 用 `from .deps import *` 复用共享底座（拆分层的一部分）。
# 星号导入无法静态解析名字，F405 只在该文件豁免；其余文件仍严格检查。
[tool.ruff.lint.per-file-ignores]
"src/p2s/console/app.py" = ["F405", "E402"]
"src/p2s/console/agent_api.py" = ["F405"]
"src/p2s/console/assets_api.py" = ["F405"]
"src/p2s/console/scan_api.py" = ["F405", "E402"]
