name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .

      - name: 代码风格
        run: python -m ruff check src tests scripts

      - name: 单元测试
        env:
          # 测试必须用固定口令，不能受开发者 shell 环境影响
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_AGENT_TOKEN: test-agent-token
        run: python -m pytest -q

      - name: 载荷守护
        run: python scripts/check_payload_literals.py .

      - name: 版本一致性
        run: python -m pytest tests/test_version.py -q

  contract:
    name: 端点契约（ubuntu / py3.12）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
      # 契约测试锁定所有接口的响应结构：拆分/重构时它是安全网
      - name: 契约测试
        env:
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_AGENT_TOKEN: test-agent-token
        run: python -m pytest tests/test_contract.py -v

  agent-scripts:
    name: 采集脚本生成校验（ubuntu / py3.12）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
      # 两个平台的脚本都必须能生成、且语法可解析 —— 0.5.3 曾因花括号转义直接语法错误
      - name: 生成并检查脚本
        run: |
          python - <<'PY'
          from p2s.core import agentkit
          for kind in ("linux", "windows"):
              text = agentkit.render(kind, "http://127.0.0.1:1", "tok")
              assert len(text) > 1000, kind
              print(kind, "ok", len(text), "bytes")
          sh = agentkit.render("linux", "http://127.0.0.1:1", "tok")
          assert sh.startswith("#!/bin/sh")
          ps = agentkit.render("windows", "http://127.0.0.1:1", "tok")
          assert ps.startswith("\ufeff"), "Windows 脚本必须带 UTF-8 BOM"
          PY
      - name: Linux 脚本语法检查
        run: |
          python - <<'PY'
          import pathlib
          from p2s.core import agentkit
          pathlib.Path("/tmp/p2s-agent.sh").write_text(
              agentkit.render("linux", "http://127.0.0.1:1", "tok"), encoding="utf-8")
          PY
          sh -n /tmp/p2s-agent.sh && echo "sh -n OK"
          bash -n /tmp/p2s-agent.sh && echo "bash -n OK"
