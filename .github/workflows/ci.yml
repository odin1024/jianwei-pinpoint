name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 仓库根是项目根，代码在 app/ 下 —— 所有 run 步骤统一在 app/ 执行
defaults:
  run:
    working-directory: app

jobs:
  # ------------------------------------------------------------------
  # 主门禁：跨平台 × 多 Python 版本
  # ------------------------------------------------------------------
  test:
    name: 测试 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 下限 3.11 由依赖决定（见 pyproject requires-python 注释）
        python: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements.lock.txt

      - name: 安装依赖（用锁文件保证可复现）
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps

      - name: 代码风格
        run: python -m ruff check src tests scripts

      # 先单独跑收集：只有这一步能区分"import/收集阶段挂起"与"某个用例挂起"。
      # 上一轮 ubuntu 静默挂 20+ 分钟，--timeout 没触发 → 说明卡在收集阶段。
      - name: 测试收集（快速验证导入与 conftest）
        env:
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_ADMIN_PASSWORD: test-pass
          P2S_AGENT_TOKEN: test-agent-token
        timeout-minutes: 5
        # 不用 `> /dev/null`：Windows runner 的默认 shell 是 PowerShell，
        # 那个重定向语法在 PowerShell 里是语法错误（曾导致该步骤直接失败）。
        run: python -m pytest --collect-only -q -p no:cacheprovider

      - name: 单元测试
        # --timeout-method=signal：Linux 上用信号中断，能真正打断阻塞的系统调用
        # （thread 方式只置标志位，卡在 connect() 里的用例不会被中止）
        # --durations=20：末尾打印最慢用例，直接暴露是哪个在等超时
        env:
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_ADMIN_PASSWORD: test-pass
          P2S_AGENT_TOKEN: test-agent-token
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 15
        run: |
          python -m pip show pytest-timeout
          python -m pytest -v --timeout=120 --durations=20 -p no:cacheprovider

      - name: 载荷守护
        run: python scripts/check_payload_literals.py .

      - name: 文档数字与代码一致
        env:
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_ADMIN_PASSWORD: test-pass
        run: python -m pytest tests/test_doc_freshness.py tests/test_benchmark.py -q

  # ------------------------------------------------------------------
  # 接口契约：锁定所有 API 的响应结构（拆分/重构时的安全网）
  # ------------------------------------------------------------------
  contract:
    name: 接口契约 · ubuntu · py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.lock.txt
      - run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps
        name: 安装依赖
      - name: 契约测试
        env:
          P2S_CONSOLE_PASSWORD: test-pass
          P2S_ADMIN_PASSWORD: test-pass
          P2S_AGENT_TOKEN: test-agent-token
        run: python -m pytest tests/test_contract.py -v

  # ------------------------------------------------------------------
  # 采集脚本：两个平台都要能生成，且 Linux 脚本必须语法可解析
  # （0.5.3 曾因花括号转义直接语法错误 —— 只在真机 sh -n 才暴露）
  # ------------------------------------------------------------------
  agent-scripts:
    name: 采集脚本语法 · ubuntu · py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.lock.txt
      - run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps
        name: 安装依赖
      - name: 渲染并检查脚本
        run: |
          python - <<'PY'
          import pathlib
          from p2s.core import agentkit

          for kind in ("linux", "windows"):
              text = agentkit.render(kind, "http://127.0.0.1:1", "tok")
              assert len(text) > 1000, kind
              print(kind, "ok", len(text), "bytes")

          sh = agentkit.render("linux", "http://127.0.0.1:1", "tok")
          assert sh.startswith("#!/bin/sh"), "Linux 脚本应以 shebang 开头"
          assert "\r" not in sh, "Linux 脚本不能含回车符（会让 sh 语法错误）"

          ps = agentkit.render("windows", "http://127.0.0.1:1", "tok")
          assert ps.startswith("\ufeff"), "Windows 脚本必须带 UTF-8 BOM"

          pathlib.Path("/tmp/p2s-agent.sh").write_text(sh, encoding="utf-8", newline="\n")
          PY
          sh -n /tmp/p2s-agent.sh && echo "sh -n OK"
          bash -n /tmp/p2s-agent.sh && echo "bash -n OK"
          python -m pytest tests/test_agent_script.py -q

  # ------------------------------------------------------------------
  # 界面门禁：起控制台 + Chrome CDP 量真实 DOM
  # （ubuntu runner 预装 Chrome；这类问题只有量计算样式才发现）
  # ------------------------------------------------------------------
  ui-gates:
    name: 界面门禁 · ubuntu · py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.lock.txt
      - run: |
          python -m pip install -U pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps
        name: 安装依赖

      # 布局门禁测量的是真实渲染尺寸。Ubuntu runner 默认没有中文字体，
      # 汉字回退成方块会让行高/列宽与开发机不一致（曾导致 rowHeight 96 vs 49）。
      - name: 安装中文字体（保证排版测量稳定）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f >/dev/null

      - name: 启动控制台
        env:
          P2S_ADMIN_PASSWORD: ci-pass
          P2S_CONSOLE_PASSWORD: ci-pass
          P2S_AGENT_TOKEN: ci-token
        run: |
          nohup python -m p2s.cli serve --host 127.0.0.1 --port 18080 > /tmp/p2s.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/api/health

      - name: JS 语法
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/check_page_js.py

      - name: HTML 标签配平
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/check_page_html.py

      - name: 前后端接口一致性
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/check_api_consistency.py

      - name: 布局与弹窗
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/check_page_layout.py

      - name: 全站 16 页审计
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/audit_pages.py

      - name: 控制台验收
        env: {P2S_ADMIN_PASSWORD: ci-pass, P2S_CONSOLE_PASSWORD: ci-pass}
        run: python scripts/verify_console.py

      - name: 失败时输出服务日志
        if: failure()
        run: tail -100 /tmp/p2s.log
